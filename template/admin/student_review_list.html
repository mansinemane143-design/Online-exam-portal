{% include "admin/navbar.html" %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#eef3f9;
    font-family:'Poppins',sans-serif;
}

.card{
    width:100%;
    margin:40px auto;
    border:none;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.card-header{
    background:linear-gradient(135deg,#166f8d,#166f8d);
    color:#fff;
    padding:20px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.card-header h3{
    margin:0;
    font-size:24px;
}

.table{
    margin:0;
}

.table th{
    background:#f8fafc;
    color:#334155;
    text-align:center;
    vertical-align:middle;
}

.table td{
    text-align:center;
    vertical-align:middle;
}

.btn-action{
    margin:2px;
}

</style>

<div class="container-fluid">

<div class="card">

<div class="card-header">

<h3>
<i class="bi bi-chat-square-text-fill"></i>
Student Reviews List
</h3>



</div>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>ID</th>
<th>Full Name</th>
<th>Bharti</th>
<th>Icon</th>
<th>Description</th>
<th width="220">Action</th>

</tr>

</thead>

<tbody>

{% for i in Student_Reviews_data %}

<tr>

<td>{{ i.id }}</td>

<td>{{ i.fullname }}</td>

<td>{{ i.bharti }}</td>

<td>
<i class="{{ i.icon }}"></i>
{{ i.icon }}
</td>

<td>{{ i.dec }}</td>

<td>



<a href="{% url 'student_review_update' i.id %}" class="btn btn-warning btn-sm btn-action">
<i class="bi bi-pencil-square"></i>

</a>

<a href="{% url 'Delete_Student_Reviews' i.id %}"
class="btn btn-danger btn-sm btn-action"
onclick="return confirm('Are you sure?')">

<i class="bi bi-trash-fill"></i>


</a>

</td>

</tr>

{% empty %}

<tr>

<td colspan="6" class="text-center text-danger">
No Student Reviews Found
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

{% include "admin/footer.html" %}
