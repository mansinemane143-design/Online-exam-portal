{% include 'admin/navbar.html' %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background:#f4f7fc;
    font-family:'Poppins',sans-serif;
}

.teacher-card{
    width:100%;
    margin:40px auto;
    border:none;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.card-header{
    background:linear-gradient(135deg,#0d6efd,#4f8cff);
    color:#fff;
    padding:25px;
}

.form-label{
    font-weight:600;
}

.input-group-text{
    background:#0d6efd;
    color:#fff;
    border:none;
}

.form-control,
.form-select{
    height:50px;
}

textarea.form-control{
    height:auto;
}

.btn-update{
    background:#0d6efd;
    color:#fff;
    border:none;
    padding:12px 40px;
    border-radius:30px;
    font-size:16px;
    font-weight:600;
}

.btn-update:hover{
    background:#084298;
    color:#fff;
}

.required{
    color:red;
}
</style>

<div class="container">

<div class="card teacher-card">

<div class="card-header">

<h3><i class="bi bi-pencil-square"></i> Update Teacher Profile</h3>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Teacher Full Name <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-person-fill"></i>
</span>

<input type="text"
name="teacher_full_name"
class="form-control"
value="{{ teacher.teacher_full_name }}"
required>

</div>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Teacher Email <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-envelope-fill"></i>
</span>

<input type="email"
name="teacher_email"
class="form-control"
value="{{ teacher.teacher_email }}"
required>

</div>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Password <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input type="text"
name="teacher_password"
class="form-control"
value="{{ teacher.teacher_password }}"
required>

</div>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Gender <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-gender-ambiguous"></i>
</span>

<select name="teacher_gender" class="form-select">

<option value="Male" {% if teacher.teacher_gender == "Male" %}selected{% endif %}>Male</option>

<option value="Female" {% if teacher.teacher_gender == "Female" %}selected{% endif %}>Female</option>

<option value="Other" {% if teacher.teacher_gender == "Other" %}selected{% endif %}>Other</option>

</select>

</div>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Date of Birth
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-calendar-fill"></i>
</span>

<input type="date"
name="teacher_dob"
class="form-control"
value="{{ teacher.teacher_dob|date:'Y-m-d' }}">

</div>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Profile Photo
</label>

<br>

{% if teacher.teacher_profile %}

<img src="{{ teacher.teacher_profile.url }}"
width="100"
height="100"
class="rounded mb-2">

{% endif %}

<input type="file"
name="teacher_profile"
class="form-control">

</div>

<div class="col-12 mb-3">

<label class="form-label">
Address
</label>

<textarea
name="teacher_address"
class="form-control"
rows="4">{{ teacher.teacher_address }}</textarea>

</div>

<div class="col-12 mb-3">

<label class="form-label">
Website
</label>

<input type="url"
name="teacher_link"
class="form-control"
value="{{ teacher.teacher_link }}">

</div>

<div class="text-center">

<button type="submit" class="btn btn-update">

<i class="bi bi-check-circle-fill"></i>

Update Teacher

</button>

</div>

</div>

</form>

</div>

</div>

</div>

{% include 'admin/footer.html' %}
