{% include 'admin/navbar.html' %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- popup  -->
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="card shadow-sm border-0 mb-4">

    <div class="card-header text-white py-3" style="background:#176F8E;">
        <h4 class="mb-0">
            <i class="bi bi-journal-plus me-2"></i>
            Available Exam Form
        </h4>
    </div>

    <div class="card-body">

        <form action="/admin/save_available_exam/" method="post">
            {% csrf_token %}

            <div class="row g-4">

                <div class="col-lg-4">
                    <label class="form-label fw-semibold">Exam Name</label>
                    <input type="text" class="form-control form-control-lg"
                           name="exam_name"
                           placeholder="Enter Exam Name" required>
                </div>

                <div class="col-lg-4">
                    <label class="form-label fw-semibold">Exam Description</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           name="exam_description"
                           placeholder="Weekly Assessment" required>
                </div>

                <div class="col-lg-4">
                    <label class="form-label fw-semibold">Total Questions</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           name="total_questions"
                           placeholder="50" required>
                </div>

                <div class="col-lg-6">
                    <label class="form-label fw-semibold">Duration (Minutes)</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           name="duration"
                           placeholder="60" required>
                </div>

                <div class="col-lg-6">
                    <label class="form-label fw-semibold">Total Marks</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           name="marks"
                           placeholder="50" required>
                </div>

                <div class="col-lg-6">
                    <label class="form-label fw-semibold">Status</label>

                    <select class="form-select form-select-lg"
                            name="status">

                        <option value="Select Option">Select Option</option>
                        <option value="available">Available Now</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="closed">Closed</option>

                    </select>

                </div>

              

                <div class="col-12 text-end">

                    <button class="btn btn-lg text-white px-5"
                            style="background:#176F8E;">

                        <i class="bi bi-check-circle me-2"></i>

                        Save Exam

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>
{% if messages %}
    {% for message in messages %}
    <script>
        Swal.fire({
            icon: 'success',
            title: 'Success!',
            text: '{{ message }}',
            confirmButtonColor: '#176F8E',
            timer: 2000,
            showConfirmButton: false
        });
    </script>
    {% endfor %}
{% endif %}

{% include 'admin/footer.html'%}
