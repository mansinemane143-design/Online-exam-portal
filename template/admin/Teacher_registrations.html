{% include 'admin/navbar.html'%}


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background:#f4f7fc;
    font-family:'Poppins',sans-serif;
}

.teacher-card{
    width:100%;
    margin:50px auto;
    border:none;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.card-header{
    background:linear-gradient(135deg,#166f8d,#166f8d);
    color:#fff;
    padding:25px;
}

.card-header h3{
    margin:0;
    font-weight:600;
}

.card-header p{
    margin:5px 0 0;
    opacity:.9;
}

.form-label{
    font-weight:600;
    margin-bottom:8px;
    color:#444;
}

.input-group-text{
    background:#166f8d;
    color:#fff;
    border:none;
}

.form-control,
.form-select{
    height:50px;
    border-radius:10px;
}

textarea.form-control{
    height:auto;
}

.form-control:focus,
.form-select:focus{
    border-color:#166f8d;
    box-shadow:0 0 10px rgba(13,110,253,.2);
}

.btn-save{
    background:linear-gradient(135deg,#166f8d);
    color:#fff;
    border:none;
    padding:13px 45px;
    font-size:17px;
    font-weight:600;
    border-radius:50px;
    transition:.3s;
}

.btn-save:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(13,110,253,.35);
}

.required{
    color:red;
}

@media(max-width:768px){

.card-header{
text-align:center;
}

}
</style>

<div class="container">

<div class="card teacher-card">

<div class="card-header">

<h3><i class="bi bi-person-workspace"></i> Teacher Profile Registration</h3>

<p>Add Teacher Details</p>

</div>

<div class="card-body p-4">

<form action="{% url 'teacher_profile' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

<div class="row">

<div class="col-md-6 mb-4">

<label class="form-label">
Teacher Full Name <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-person-fill"></i>
</span>

<input type="text"
name="teacher_full_name"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Teacher Email <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-envelope-fill"></i>
</span>

<input type="email"
name="teacher_email"
class="form-control"
placeholder="Enter Email"
required>

</div>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Password <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input type="password"
name="teacher_password"
class="form-control"
placeholder="Enter Password"
required>

</div>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Gender <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-gender-ambiguous"></i>
</span>

<select class="form-select"
name="teacher_gender"
required>

<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Date of Birth <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-calendar-date-fill"></i>
</span>

<input type="date"
name="teacher_dob"
class="form-control"
required>

</div>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Profile Photo <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-image-fill"></i>
</span>

<input type="file"
name="teacher_profile"
class="form-control"
required>

</div>

</div>

<div class="col-12 mb-4">

<label class="form-label">
Address <span class="required">*</span>
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-geo-alt-fill"></i>
</span>

<textarea
name="teacher_address"
class="form-control"
rows="4"
placeholder="Enter Address"
required></textarea>

</div>

</div>

<div class="col-12 mb-4">

<label class="form-label">
Website / Link
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-link-45deg"></i>
</span>

<input type="url"
name="teacher_link"
class="form-control"
placeholder="https://example.com">

</div>

</div>

<div class="col-12 text-center mt-3">

<button type="submit" class="btn btn-save">

<i class="bi bi-check-circle-fill"></i>

Save Teacher Profile

</button>

</div>

</div>

</form>

</div>

</div>

</div>

{% include 'admin/footer.html'%}
