    {% include "admin/navbar.html" %}

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#eef3f9;
        font-family:'Poppins',sans-serif;
    }

    .page-wrap{
        width: 100%;
        margin:40px auto;
        padding:20px;
    }

    .form-card{
        background:#fff;
        border-radius:20px;
        overflow:hidden;
        box-shadow:0 15px 40px rgba(0,0,0,.08);
    }

    .form-header{
        background:linear-gradient(135deg,#166f8d,#166f8d);
        padding:25px;
        display:flex;
        align-items:center;
        gap:15px;
    }

    .form-header .icon{
        width:60px;
        height:60px;
        border-radius:50%;
        background:rgba(255,255,255,.18);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:28px;
        color:#fff;
    }

    .form-header h2{
        color:#fff;
        margin:0;
        font-size:28px;
        font-weight:600;
    }

    .form-header p{
        margin:4px 0 0;
        color:#fef3c7;
        font-size:14px;
    }

    .form-body{
        padding:35px;
    }

    .form-grid{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:22px;
    }

    .input-group{
        display:flex;
        flex-direction:column;
    }

    .input-group label{
        margin-bottom:8px;
        font-weight:600;
        color:#334155;
    }

    .input-box{
        position:relative;
    }

    .input-box i{
        position:absolute;
        left:15px;
        top:50%;
        transform:translateY(-50%);
        color:#166f8d;
        font-size:18px;
    }

    .input-box input{
        width:100%;
        height:50px;
        padding-left:48px;
        border:1px solid #d7dce5;
        border-radius:12px;
        background:#fafafa;
        font-size:15px;
    }

    .input-box input:focus{
        border-color:#f59e0b;
        background:#fff;
        box-shadow:0 0 0 4px rgba(245,158,11,.15);
        outline:none;
    }

    .btn-area{
        margin-top:35px;
    }

    .update-btn{
        width:100%;
        height:55px;
        border:none;
        border-radius:12px;
        background:linear-gradient(135deg,#166f8d,#166f8d);
        color:#fff;
        font-size:17px;
        font-weight:600;
        cursor:pointer;
        transition:.3s;
    }

    .update-btn:hover{
        transform:translateY(-3px);
        box-shadow:0 12px 25px rgba(245,158,11,.35);
    }

    @media(max-width:768px){

    .form-grid{
    grid-template-columns:1fr;
    }

    .form-header{
    flex-direction:column;
    text-align:center;
    }

    .form-body{
    padding:22px;
    }

    }

    </style>

    <div class="page-wrap">

    <div class="form-card">

    <div class="form-header">

    <div class="icon">
    <i class="bi bi-pencil-square"></i>
    </div>

    <div>
    <h2>Update Student Review</h2>
    <p>Edit Student Review Information</p>
    </div>

    </div>

    <div class="form-body">

    <form method="POST">

    {% csrf_token %}

    <input type="hidden" name="id" value="{{ i.id }}">

    <div class="form-grid">

    <div class="input-group">
    <label>Full Name</label>

    <div class="input-box">
    <i class="bi bi-person-fill"></i>
    <input type="text" name="fullname" value="{{ i.fullname }}" required>
    </div>

    </div>

    <div class="input-group">
    <label>Bharti</label>

    <div class="input-box">
    <i class="bi bi-bookmark-fill"></i>
    <input type="text" name="bharti" value="{{ i.bharti }}" required>
    </div>

    </div>

    <div class="input-group">
    <label>Icon</label>

    <div class="input-box">
    <i class="bi bi-emoji-smile-fill"></i>
    <input type="text" name="icon" value="{{ i.icon }}">
    </div>

    </div>

    <div class="input-group">
    <label>Description</label>

    <div class="input-box">
    <i class="bi bi-chat-left-text-fill"></i>
    <input type="text" name="dec" value="{{ i.dec }}">
    </div>

    </div>

    </div>


    <div class="btn-area">

    <button type="submit" class="update-btn">

    <i class="bi bi-arrow-repeat"></i>

    &nbsp; Update Review

    </button>

    </div>

    </form>

    </div>

    </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% if messages %}
    {% for message in messages %}

    <script>

    Swal.fire({
    icon:'success',
    title:'Updated',
    text:'{{ message }}',
    confirmButtonColor:'#f59e0b'
    });

    </script>

    {% endfor %}
    {% endif %}

    {% include "admin/footer.html" %}
