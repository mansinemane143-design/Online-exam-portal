{% include 'admin/navbar.html' %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:#f4f7fc;
}

.academy-card{
    max-width:1100px;
    margin:40px auto;
    border:none;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.card-header{
    background:linear-gradient(135deg,#0d6efd,#198754);
    color:#fff;
    padding:18px;
}

.form-label{
    font-weight:600;
}

.form-control,
.form-select{
    border-radius:10px;
}

.btn-update{
    background:#198754;
    color:#fff;
    padding:10px 35px;
    border:none;
    border-radius:10px;
    font-weight:600;
}

.btn-update:hover{
    background:#157347;
}

.preview-img{
    width:120px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid #ddd;
    margin-bottom:10px;
}
</style>

<div class="container">

<div class="card academy-card">

<div class="card-header">
    <h3><i class="bi bi-pencil-square"></i> Update Academy</h3>
</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Academy Name</label>
<input type="text" name="academy_name" class="form-control"
value="{{ academy.academy_name }}" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Owner Name</label>
<input type="text" name="owner_name" class="form-control"
value="{{ academy.owner_name }}" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control"
value="{{ academy.email }}" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Mobile</label>
<input type="text" name="mobile" class="form-control"
value="{{ academy.mobile }}" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Address</label>
<textarea name="address" class="form-control" rows="3">{{ academy.address }}</textarea>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">City</label>
<input type="text" name="city" class="form-control"
value="{{ academy.city }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">State</label>
<input type="text" name="state" class="form-control"
value="{{ academy.state }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Pincode</label>
<input type="text" name="pincode" class="form-control"
value="{{ academy.pincode }}">
</div>

<div class="col-md-6 mb-3">

<label class="form-label">Academy Logo</label>

{% if academy.academy_logo %}
<br>
<img src="{{ academy.academy_logo.url }}" class="preview-img">
{% endif %}

<input type="file" name="academy_logo" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Academy Banner</label>

{% if academy.academy_banner %}
<br>
<img src="{{ academy.academy_banner.url }}" class="preview-img">
{% endif %}

<input type="file" name="academy_banner" class="form-control">

</div>

<div class="col-md-6 mb-3">
<label class="form-label">Website</label>
<input type="url" name="website" class="form-control"
value="{{ academy.website }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Status</label>

<select name="status" class="form-select">

<option value="Active" {% if academy.status == "Active" %}selected{% endif %}>
Active
</option>

<option value="Inactive" {% if academy.status == "Inactive" %}selected{% endif %}>
Inactive
</option>

</select>

</div>

<div class="col-md-12 mb-4">
<label class="form-label">Description</label>

<textarea name="description" rows="4" class="form-control">{{ academy.description }}</textarea>

</div>

<div class="col-md-12 text-center">

<button type="submit" class="btn btn-update">
<i class="bi bi-save"></i> Update Academy
</button>

</div>

</div>

</form>

</div>

</div>

</div>

{% include 'admin/footer.html' %}
