{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#eefcf6,#d9f8ec,#c5f3df);
}

.login-wrapper{
    width:1100px;
    background:#fff;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,.12);
}

.left-panel{
    background:linear-gradient(135deg,#0f766e,#0f766e);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px;
}

.left-panel img{
    width:320px;
}

.left-panel h2{
    font-size:38px;
    font-weight:700;
    margin-top:30px;
}

.left-panel p{
    margin-top:15px;
    line-height:30px;
    opacity:.95;
}

.right-panel{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px;
    background:#fff;
}

.login-card{
    width:100%;
    max-width:420px;
}

.login-card h3{
    font-size:34px;
    color:#0f766e;
    font-weight:700;
}

.login-card p{
    color:#777;
}

.input-group-text{
    background:#fff;
    border-right:none;
}

.form-control{
    border-left:none;
    height:55px;
}

.form-control:focus{
    box-shadow:none;
    border-color:#0f766e;
}

.input-group{
    border:1px solid #ddd;
    border-radius:12px;
    overflow:hidden;
}

.login-btn{
    height:55px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#0f766e,#0f766e);
    color:#fff;
    font-size:18px;
    font-weight:600;
    transition:.4s;
}

.login-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 25px rgba(16,185,129,.35);
}

.forgot{
    text-decoration:none;
    color:#0f766e;
    font-weight:600;
}

.forgot:hover{
    color:#0f766e;
}

@media(max-width:992px){

.left-panel{
display:none;
}

.right-panel{
padding:40px 25px;
}

.login-wrapper{
width:95%;
}

}

</style>

</head>

<body>

<div class="login-wrapper">

<div class="row g-0">

<div class="col-lg-6 left-panel">

<div class="text-center">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3pU3b2LJEhfMTtSp4Dg7NFuqMxgM3jTPPSqYMPejZ9w&s=10" alt="">

<h2>Admin Panel</h2>

<p>
Manage Student, Teacher,
 website activities from one secure dashboard.
</p>

</div>

</div>

<div class="col-lg-6 right-panel">

<div class="login-card">

<div class="text-center mb-4">

<i class="bi bi-shield-lock-fill text-success" style="font-size:70px;"></i>

<h3 class="mt-3">Welcome Back</h3>

<p>Login to your Admin Account</p>

</div>

{% if messages %}
{% for message in messages %}
<div class="alert alert-danger">
{{ message }}
</div>
{% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label fw-semibold">Email Address</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-envelope-fill"></i>
</span>

<input type="email"
class="form-control"
name="email"
placeholder="Enter Email"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">Password</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input type="password"
class="form-control"
name="password"
placeholder="Enter Password"
required>

</div>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

<div class="form-check">

<input class="form-check-input" type="checkbox">

<label class="form-check-label">
Remember Me
</label>

</div>



</div>

<div class="d-grid">

<button class="login-btn">
<i class="bi bi-box-arrow-in-right"></i>
Login
</button>

</div>

</form>

<div class="text-center mt-4">

<small class="text-muted">
© 2026 Admin Panel Exam Portal
</small>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
