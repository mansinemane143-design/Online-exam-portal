<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    background:#eef3f9;
}

.card{
    width:100%;
    max-width:100%;
    border:none;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.card{
    border:none;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.card-header{
    background:linear-gradient(135deg,#0d6efd,#2563eb);
    color:#fff;
    text-align:center;
    padding:30px;
}

.card-header i{
    font-size:45px;
    margin-bottom:10px;
}

.card-header h3{
    font-weight:700;
    margin-bottom:5px;
}

.card-header p{
    margin:0;
    opacity:.9;
}

.card-body{
    padding:35px;
}

.form-label{
    font-weight:600;
    margin-bottom:8px;
    color:#333;
}

.form-control,
.form-select{
    height:50px;
    border-radius:10px;
    border:1px solid #dcdcdc;
    transition:.3s;
}

.form-control:focus,
.form-select:focus{
    border-color:#0d6efd;
    box-shadow:0 0 8px rgba(13,110,253,.25);
}

.btn{
    height:48px;
    border-radius:10px;
    font-weight:600;
}

.btn-primary{
    background:#0d6efd;
    border:none;
}

.btn-primary:hover{
    background:#0b5ed7;
}

.btn-outline-secondary:hover{
    background:#6c757d;
    color:#fff;
}

.text-danger{
    font-size:14px;
}

@media(max-width:768px){

.card-body{
    padding:20px;
}

.row.g-3 .col-md-6{
    margin-bottom:10px;
}

}
</style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-primary text-white text-center py-4">

                    <i class="fa-solid fa-layer-group fa-3x mb-3"></i>

                    <h3 class="mb-1">Add Sub Category</h3>

                    <p class="mb-0">Create a New Sub Category</p>

                </div>

                <div class="card-body p-4">

                    <form action="{% url 'add_sub_category' %}" method="POST" id="subCategoryForm">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Subject Name
                            </label>

                            <select class="form-select form-select-lg" id="subject" name="subject">

                                <option value="">Select Subject</option>

                                <option value="Python">Python</option>

                                <option value="Java">Java</option>

                                <option value="DBMS">DBMS</option>

                                <option value="Web Technology">Web Technology</option>

                            </select>

                            <small class="text-danger" id="subjectError"></small>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Sub Category Name
                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg"
                                id="subCategory"
                                name="sub_category"
                                placeholder="Enter Sub Category Name"
                            >

                            <small class="text-danger" id="categoryError"></small>

                        </div>
<div class="row mt-4 g-3">
    <div class="col-md-6">
        <button type="reset" class="btn btn-outline-secondary w-100">
            <i class="fa-solid fa-rotate-left me-2"></i>Reset
        </button>
    </div>

    <div class="col-md-6">
        <button type="submit" class="btn btn-primary w-100">
            <i class="fa-solid fa-floppy-disk me-2"></i>Save Sub Category
        </button>
    </div>
</div>  

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
const form = document.getElementById("subCategoryForm");

form.addEventListener("submit", function(e){

    e.preventDefault();

    let valid = true;

    document.getElementById("subjectError").innerHTML = "";
    document.getElementById("categoryError").innerHTML = "";

    let subject = document.getElementById("subject").value;
    let category = document.getElementById("subCategory").value.trim();

    if(subject === ""){
        document.getElementById("subjectError").innerHTML = "Please Select Subject";
        valid = false;
    }

    if(category === ""){
        document.getElementById("categoryError").innerHTML = "Please Enter Sub Category Name";
        valid = false;
    }
    else if(category.length < 3){
        document.getElementById("categoryError").innerHTML = "Minimum 3 Characters Required";
        valid = false;
    }
    else if(!/^[A-Za-z ]+$/.test(category)){
        document.getElementById("categoryError").innerHTML = "Only Letters Allowed";
        valid = false;
    }

    if(valid){

        Swal.fire({
            icon: "success",
            title: "Success",
            text: "Form Successfully Submitted",
            confirmButtonColor: "#0d6efd"
        }).then(() => {
            form.submit();
        });

    }

});
</script>
