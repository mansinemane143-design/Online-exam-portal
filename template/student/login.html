<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D Academy Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<style>


    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0b2950;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    display:flex;
    height:100vh;
    width:100%;
    
}

/* LEFT SIDE BIG */


/* DARK OVERLAY */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(0, 10, 31, 0.55);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:rgb(247, 242, 242);
    text-align:center;
}

/* LOGO TOP CENTER */
.logo-area{
    position:absolute;
    margin-top:60px;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
}

.logo-area img{
    height:200px;
}

.overlay h1{
    margin-top:160px;
    font-size:30px;
    margin-bottom:10px;
}
.overlay h2{
    font-size:40px;
    margin-bottom:10px;
    color:#ecb00b;
}
.academy-title{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.academy-title h2{
    color:blue;
    font-size: 40px;
    letter-spacing: 8px;
    margin: 0;
}

.academy-title span{
    width: 120px;
    height: 2px;
    background: linear-gradient(
        to right,
        transparent,
        blue,
        transparent
    );
}
.tagline{
    font-size: 24px;
    margin-top: 10px;
    font-weight: 600;
    color: blue;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.description{
    font-size: 18px;
    line-height: 1.8;
    color: rgba(255,255,255,0.85);
    max-width: 500px;
    text-align: justify;
}

.overlay p{
    font-size:20px;
}


.right-panel{
    flex:1;
    background:rgb(255, 255, 255);
    padding:70px;
    display:flex;
    flex-direction:column;
    justify-content:center;

    
    
}
.user-icon{
    width:90px;
    height:90px;

    background:blue;
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:0 auto 25px;
}



.title{
    
    font-size:28px;
    text-align:center;
    margin-bottom:30px;
    color:#112f6b;
    
}
.subtitle{
    margin-top:-20px;
    font-size:18px;
    text-align:center;
    margin-bottom:20px;
    /* color:#717c96; */
}
form{
    display: flex;
    flex-direction: column;
}

input{
    width:100%;
    padding:14px;
    color:#f4f7fb;
    margin-bottom:15px;
    /* border:1px solid #5f96d1; */
    border-radius:8px;
    font-size:16px;
}
.input-box{
    position: relative;
    margin-bottom: 20px;
}

.input-box i{
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #676262;
    font-size: 16px;
}

.input-box input{
    width: 100%;
    padding: 18px 18px 18px 45px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 18px;
}






.login-btn{
    width:100%;
    padding:14px;
    background:blue;
    color:rgba(255, 255, 255, 0.984);
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.login-btn:hover{
    /* background:#51a950; */
    
    
    color: white;
    border-color: #b87790;
}





.left-panel{
    flex:2;
    background:url("/static/ad/images/image.1.png");

    background-size:cover;
    background-position:center;
}
.logo{
    width: 80px;
    height: 80px;
    background:url("/static/ad/images/image.1.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.logo-section img{
    width:120px;
    background-image: url("/static/ad/images/image.1.png");
    height:auto;
    margin-bottom:10px;
}

.logo-section h1{
    color:#342b2b;
    font-size:42px;
    font-weight:700;
}


 @media (max-width: 768px){

    .container{
        flex-direction:column;
        height:auto;
    }

    .left-panel{
        min-height:250px;
    }

    .right-panel{
        padding:30px 20px;
    }

    .logo-section h1{
        font-size:28px;
    }

    .overlay p{
        font-size:16px;
    }
} 

.notice1{
    /* padding:40px; */
    margin-top: 100PX;
    color:#fff;
    margin-left: 35%;
    /* border-radius: 50%; */
    
}

.notice-section{
    background:#ffffff;
    color:#333;
    padding:18px;
    margin-bottom:18px;
    border-radius:10px;
    border-left:5px solid blue;
}

.notice2{
    color:#0B1F3A;
    margin-bottom:8px;
}

.notice3{
    color:#666;
}

.notice4,
.notice6,
.notice12,
.notice14{
    color:#0B1F3A;
    margin-bottom:10px;
}

.notice5,
.notice13,
.notice15{
    line-height:1.7;
}

.notice7{
    padding-left:20px;
}

.notice8,
.notice9,
.notice10,
.notice11{
    margin-bottom:8px;
}

</style>
<body>



<div class="container">
<div class="notice1">


    <!-- Right Side Login Form -->
    <div class="right-panel">
        <div class="login-box"></div>

            <h2 class="title">Welcome Student Login</h2>
            <h2 class="subtitle">Start Your Learning Journey</h2>
            <form  method="post">
                {% csrf_token %}
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="email" placeholder="Username or Email">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password"  placeholder="Password">
            </div>
            <button class="login-btn">Login</button>
            </form>

    </div>

</div>

</body>
</html>
