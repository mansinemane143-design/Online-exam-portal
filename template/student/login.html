{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="{% static 'student/css/student_auth.css' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <!-- Left Side -->

        <div class="left-panel">

            <img src="{% static 'student/images/login.png' %}" alt="Student Login">

        </div>

        <!-- Right Side -->

        <div class="right-panel">

            <div class="login-card">

                <div class="logo">

                    <img src="{% static 'student/images/logo.png' %}" alt="Logo">

                </div>

                <h2>Student Login</h2>

                <p>
                    Welcome Back! Login to continue your learning journey.
                </p>

                {% if messages %}

                {% for message in messages %}

                <div class="alert">

                    {{ message }}

                </div>

                {% endfor %}

                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter Email Address"
                            required>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter Password"
                            required>

                        <span onclick="togglePassword()">

                            <i class="fa-solid fa-eye" id="eyeIcon"></i>

                        </span>

                    </div>

                    <div class="remember-forgot">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="{% url 'forgot_password' %}">
                            Forgot Password?
                        </a>

                    </div>

                    <button type="submit">
                        Login
                    </button>

                </form>

                <div class="bottom-text">

                    Don't have an account?

                    <a href="{% url 'registration' %}">

                        Register Now

                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="{% static 'student/js/student_auth.js' %}"></script>

</body>

</html>
