{% include 'admin/navbar.html' %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:#f4f7fc;
}

.academy-card{
    max-width:1100px;
    margin:40px auto;
    border:none;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.card-header{
    background:linear-gradient(135deg,#0d6efd,#198754);
    color:white;
    padding:18px;
}

.card-header h3{
    margin:0;
    font-weight:600;
}

.form-label{
    font-weight:600;
    color:#444;
}

.form-control,
.form-select{
    border-radius:10px;
    padding:10px 15px;
}

.form-control:focus,
.form-select:focus{
    box-shadow:none;
    border-color:#0d6efd;
}

.btn-save{
    background:#198754;
    color:#fff;
    border:none;
    padding:12px 35px;
    border-radius:10px;
    font-size:17px;
    font-weight:600;
}

.btn-save:hover{
    background:#157347;
}

.icon{
    color:#0d6efd;
    margin-right:6px;
}
</style>

<div class="container">

<div class="card academy-card">

<div class="card-header">
    <h3><i class="bi bi-buildings-fill"></i> Add Academy</h3>
</div>

<div class="card-body">

<form action="{% url 'add_academy' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-building icon"></i>Academy Name
</label>
<input type="text" name="academy_name" class="form-control" placeholder="Enter Academy Name" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-person-fill icon"></i>Owner Name
</label>
<input type="text" name="owner_name" class="form-control" placeholder="Enter Owner Name" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-envelope-fill icon"></i>Email
</label>
<input type="email" name="email" class="form-control" placeholder="Enter Email Address" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-telephone-fill icon"></i>Mobile Number
</label>
<input type="text" name="mobile" maxlength="10" class="form-control" placeholder="Enter Mobile Number" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-geo-alt-fill icon"></i>Address
</label>
<textarea name="address" rows="3" class="form-control" placeholder="Enter Address"></textarea>
</div>

<div class="col-md-6">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-pin-map-fill icon"></i>City
</label>
<input type="text" name="city" class="form-control" placeholder="Enter City">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-globe icon"></i>State
</label>
<input type="text" name="state" class="form-control" placeholder="Enter State">
</div>

<div class="col-md-12 mb-3">
<label class="form-label">
<i class="bi bi-mailbox2 icon"></i>Pincode
</label>
<input type="text" name="pincode" class="form-control" placeholder="Enter Pincode">
</div>

</div>

</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-image-fill icon"></i>Academy Logo
</label>
<input type="file" name="academy_logo" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-card-image icon"></i>Academy Banner
</label>
<input type="file" name="academy_banner" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-link-45deg icon"></i>Website
</label>
<input type="url" name="website" class="form-control" placeholder="https://example.com">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-check-circle-fill icon"></i>Status
</label>
<select name="status" class="form-select">
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
</select>
</div>

<div class="col-md-12 mb-4">
<label class="form-label">
<i class="bi bi-card-text icon"></i>Description
</label>
<textarea name="description" rows="4" class="form-control" placeholder="Enter Academy Description"></textarea>
</div>

<div class="col-md-12 text-center">
<button type="submit" class="btn btn-save">
<i class="bi bi-save"></i> Save Academy
</button>
</div>

</div>

</form>

</div>

</div>

</div>

{% include 'admin/footer.html' %}
