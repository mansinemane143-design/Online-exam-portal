{% include "teacher/navbar.html" %}


<div class="card mt-4 shadow">

    <div class="card-header text-white d-flex justify-content-between align-items-center" style="background:#166f8d;">
        <h5 class="mb-0">Sub Category List</h5>

        <input type="text"
               class="form-control w-25"
               placeholder="Search...">
    </div>

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle text-center">

                <thead class="table-dark">

                    <tr>
                        <th>Sr.No</th>
                        <th>Subject Name</th>
                        <th>Sub Category</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody>

                    {% for i in sub_category_data %}

                    <tr>

                        <td>{{ forloop.counter }}</td>

                        <td>{{ i.subject }}</td>

                        <td>{{ i.sub_category }}</td>


                        <td>

                        

                            <a href="{% url 'delete_subcategory' i.id %}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Deleted Successfully')">

                                <i class="fa-solid fa-trash"></i>

                            </a>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td colspan="5">
                            No Record Found
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% include "teacher/footer.html" %}
